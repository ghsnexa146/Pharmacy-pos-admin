<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PharmaPOS Central Admin - D. Hossain</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --green: #10b981;
      --orange: #f59e0b;
      --red: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ADMIN LOGIN GATE */
    #admin-login-gate {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }
    .login-box {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 24px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
    }
    .login-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #eff6ff;
      color: var(--primary);
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }
    .login-box h2 { font-size: 21px; font-weight: 800; }
    .login-box p { font-size: 13px; color: var(--muted); margin-top: 4px; margin-bottom: 18px; }
    .input-group {
      text-align: left;
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }
    .input-group input:focus { border-color: var(--primary); }
    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    .login-err {
      color: var(--red);
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
      display: none;
    }

    /* MAIN DASHBOARD */
    #admin-dashboard {
      display: none;
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 50px;
    }
    .topbar {
      background: #0f172a;
      color: #ffffff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar-left h1 { font-size: 17px; font-weight: 800; }
    .topbar-left span { font-size: 11px; color: #94a3b8; }
    .topbar-actions { display: flex; gap: 8px; }
    .btn-top {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .container { padding: 16px; }

    /* KPI STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 12px;
      text-align: center;
    }
    .stat-card span {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-card strong {
      display: block;
      font-size: 22px;
      font-weight: 800;
      margin-top: 4px;
    }
    .stat-card.pending strong { color: var(--orange); }
    .stat-card.approved strong { color: var(--green); }
    .stat-card.total strong { color: var(--primary); }

    /* SEARCH & FILTER */
    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-wrap {
      position: relative;
    }
    .search-wrap i {
      position: absolute;
      left: 14px;
      top: 13px;
      color: var(--muted);
    }
    .search-wrap input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      background: #fff;
      outline: none;
    }
    .filter-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    .f-tab {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .f-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* STORE CARDS */
    .store-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .store-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .store-card.is-pending { border-left: 5px solid var(--orange); }
    .store-card.is-approved { border-left: 5px solid var(--green); }
    .store-card.is-suspended { border-left: 5px solid var(--red); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .store-id-tag {
      display: inline-block;
      background: #eff6ff;
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .card-header h3 { font-size: 16px; font-weight: 800; }
    .status-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .st-pending { background: #fef3c7; color: #92400e; }
    .st-approved { background: #dcfce7; color: #166534; }
    .st-suspended { background: #fee2e2; color: #991b1b; }

    .card-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
      color: #334155;
    }
    .detail-item span {
      display: block;
      font-size: 10px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
    }
    .pin-reveal {
      font-family: monospace;
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
      color: #0f172a;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }
    .act-btn {
      flex: 1;
      min-width: 100px;
      padding: 9px 10px;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-approve { background: var(--green); color: #fff; }
    .btn-suspend { background: #fef3c7; color: #b45309; }
    .btn-wa { background: #dcfce7; color: #15803d; }
    .btn-del { background: #fee2e2; color: #dc2626; max-width: 44px; min-width: 44px; }

    .footer-credit {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 28px;
    }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 12px;
      font-weight: 600;
      display: none;
      z-index: 10000;
    }
  </style>
</head>
<body>

  <!-- MASTER ADMIN LOGIN GATE -->
  <div id="admin-login-gate">
    <div class="login-box">
      <div class="login-icon"><i class="fa-solid fa-user-shield"></i></div>
      <h2>Central License Admin</h2>
      <p>PharmaPOS Pro • Master Control Panel</p>

      <div class="input-group">
        <label>Admin Mobile Number</label>
        <input type="tel" id="master-phone" maxlength="10" value="6909998882" placeholder="Enter Admin Phone" />
      </div>
      <div class="input-group">
        <label>Master Access Password</label>
        <input type="password" id="master-pass" placeholder="Enter Master Password" />
      </div>
      <button class="btn-login" onclick="verifyMasterAdmin()">
        <i class="fa-solid fa-lock-open"></i> Unlock Control Panel
      </button>
      <div class="login-err" id="login-err">Invalid Admin Credentials!</div>
    </div>
  </div>

  <!-- MAIN ADMIN DASHBOARD -->
  <div id="admin-dashboard">
    <header class="topbar">
      <div class="topbar-left">
        <h1>PharmaPOS Central Admin</h1>
        <span>Live License Authority • D. Hossain</span>
      </div>
      <div class="topbar-actions">
        <button class="btn-top" onclick="changeMasterPass()" title="Change Admin Password"><i class="fa-solid fa-key"></i></button>
        <button class="btn-top" onclick="logoutMasterAdmin()"><i class="fa-solid fa-right-from-bracket"></i> Exit</button>
      </div>
    </header>

    <div class="container">
      <!-- KPI CARDS -->
      <div class="stats-grid">
        <div class="stat-card pending">
          <span>Pending</span>
          <strong id="stat-pending">0</strong>
        </div>
        <div class="stat-card approved">
          <span>Active / Approved</span>
          <strong id="stat-approved">0</strong>
        </div>
        <div class="stat-card total">
          <span>Total Stores</span>
          <strong id="stat-total">0</strong>
        </div>
      </div>

      <!-- SEARCH & FILTERS -->
      <div class="controls-bar">
        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="Search Store ID, Name, Owner or Phone..." oninput="renderStores()" />
        </div>
        <div class="filter-tabs">
          <button class="f-tab active" onclick="setFilter('all', this)">All Requests</button>
          <button class="f-tab" onclick="setFilter('pending', this)">Pending Approval</button>
          <button class="f-tab" onclick="setFilter('approved', this)">Approved</button>
          <button class="f-tab" onclick="setFilter('suspended', this)">Suspended</button>
        </div>
      </div>

      <!-- LIVE STORE REQUESTS LIST -->
      <div class="store-list" id="store-list-container">
        <p style="text-align:center; color:#64748b; padding:30px;">Connecting to Firebase Central Server...</p>
      </div>

      <div class="footer-credit">
        Designed & Developed by <strong>D. Hossain</strong> • ঘুম হীন স্বপ্ন
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const MASTER_FIREBASE_CONFIG = {
      apiKey: "AIzaSyA5nFNlBoeSjYp7OA7IeObWuuStfTLhKiA",
      authDomain: "pharmacy-pos-84203.firebaseapp.com",
      projectId: "pharmacy-pos-84203",
      storageBucket: "pharmacy-pos-84203.firebasestorage.app",
      messagingSenderId: "1082478795452",
      appId: "1:1082478795452:web:2ed69b5b55cbe2e2454eb9"
    };

    const app = initializeApp(MASTER_FIREBASE_CONFIG);
    const db = getFirestore(app);

    const ADMIN_PHONE = "6909998882";
    const PASS_STORAGE_KEY = "ghs_central_admin_pass";
    const SESSION_KEY = "ghs_central_admin_unlocked";

    let allStores = [];
    let currentFilter = "all";

    function getMasterPassword() {
      return localStorage.getItem(PASS_STORAGE_KEY) || "6909998882";
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.style.display = "block";
      clearTimeout(window._t);
      window._t = setTimeout(() => t.style.display = "none", 2500);
    }

    // Check existing session
    if (sessionStorage.getItem(SESSION_KEY) === "true") {
      unlockDashboard();
    }

    window.verifyMasterAdmin = function() {
      const phone = document.getElementById("master-phone").value.trim();
      const pass = document.getElementById("master-pass").value.trim();
      const err = document.getElementById("login-err");

      if (phone === ADMIN_PHONE && pass === getMasterPassword()) {
        sessionStorage.setItem(SESSION_KEY, "true");
        err.style.display = "none";
        unlockDashboard();
      } else {
        err.style.display = "block";
      }
    };

    window.logoutMasterAdmin = function() {
      sessionStorage.removeItem(SESSION_KEY);
      location.reload();
    };

    window.changeMasterPass = function() {
      const newPass = prompt("Enter new Master Admin Password (min 4 characters):");
      if (newPass && newPass.trim().length >= 4) {
        localStorage.setItem(PASS_STORAGE_KEY, newPass.trim());
        showToast("Master Admin password updated!");
      }
    };

    function unlockDashboard() {
      document.getElementById("admin-login-gate").style.display = "none";
      document.getElementById("admin-dashboard").style.display = "block";
      listenToStoreRequests();
    }

    function listenToStoreRequests() {
      const colRef = collection(db, "license_requests");
      onSnapshot(colRef, (snapshot) => {
        allStores = [];
        snapshot.forEach((docSnap) => {
          allStores.push({ id: docSnap.id, ...docSnap.data() });
        });

        // Sort: Pending first, then newest requestedAt
        allStores.sort((a, b) => {
          if (a.status === "pending" && b.status !== "pending") return -1;
          if (a.status !== "pending" && b.status === "pending") return 1;
          return (b.requestedAt || "").localeCompare(a.requestedAt || "");
        });

        updateStats();
        renderStores();
      }, (error) => {
        console.error("Firestore read error:", error);
        document.getElementById("store-list-container").innerHTML = `
          <div style="background:#fee2e2; color:#991b1b; padding:16px; border-radius:14px; font-size:13px;">
            <strong>Firestore Permission Error!</strong><br/>
            Please enable Cloud Firestore in your Firebase Console and set security rules to allow read/write on <code>license_requests</code>.
          </div>
        `;
      });
    }

    function updateStats() {
      const pending = allStores.filter(s => s.status === "pending").length;
      const approved = allStores.filter(s => s.status === "approved").length;
      document.getElementById("stat-pending").innerText = pending;
      document.getElementById("stat-approved").innerText = approved;
      document.getElementById("stat-total").innerText = allStores.length;
    }

    window.setFilter = function(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll(".f-tab").forEach(el => el.classList.remove("active"));
      btn.classList.add("active");
      renderStores();
    };

    window.renderStores = function() {
      const container = document.getElementById("store-list-container");
      const q = (document.getElementById("search-input").value || "").toLowerCase();

      const filtered = allStores.filter(s => {
        const matchFilter = currentFilter === "all" || s.status === currentFilter;
        const matchQuery =
          (s.profileId || "").toLowerCase().includes(q) ||
          (s.bizName || "").toLowerCase().includes(q) ||
          (s.ownerName || "").toLowerCase().includes(q) ||
          (s.phone || "").includes(q);
        return matchFilter && matchQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#64748b; padding:30px;">No store records found.</p>`;
        return;
      }

      container.innerHTML = filtered.map(s => {
        const status = s.status || "pending";
        const cardClass = status === "approved" ? "is-approved" : (status === "suspended" ? "is-suspended" : "is-pending");
        const pillClass = status === "approved" ? "st-approved" : (status === "suspended" ? "st-suspended" : "st-pending");
        const reqDate = s.requestedAt ? new Date(s.requestedAt).toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : 'N/A';

        const waMsg = encodeURIComponent(
          `Hello ${s.ownerName},\nYour *PharmaPOS Pro* license for *${s.bizName}* (Store ID: *${s.profileId}*) has been *APPROVED*! You can now use your terminal.\n\n- D. Hossain (ঘুম হীন স্বপ্ন)`
        );

        return `
          <div class="store-card ${cardClass}">
            <div class="card-header">
              <div>
                <span class="store-id-tag">${s.profileId}</span>
                <h3>${s.bizName || 'Unnamed Pharmacy'}</h3>
              </div>
              <span class="status-pill ${pillClass}">${status}</span>
            </div>

            <div class="card-details">
              <div class="detail-item">
                <span>Owner Name</span>
                <strong>${s.ownerName || '-'}</strong>
              </div>
              <div class="detail-item">
                <span>Mobile / WhatsApp</span>
                <strong>${s.phone || '-'}</strong>
              </div>
              <div class="detail-item">
                <span>Location</span>
                <strong>${s.city || ''}, ${s.district || ''} (${s.pin || ''})</strong>
              </div>
              <div class="detail-item">
                <span>Admin 6-Digit PIN</span>
                <span class="pin-reveal">${s.adminPin || 'Not Set'}</span>
              </div>
              <div class="detail-item">
                <span>GST / Drug Lic.</span>
                <strong>${s.gst || 'N/A'} | ${s.dlNo || 'N/A'}</strong>
              </div>
              <div class="detail-item">
                <span>Registered On</span>
                <strong>${reqDate}</strong>
              </div>
            </div>

            <div class="card-actions">
              ${status !== 'approved' ? `
                <button class="act-btn btn-approve" onclick="updateStoreStatus('${s.id}', 'approved')">
                  <i class="fa-solid fa-circle-check"></i> Approve
                </button>
              ` : `
                <button class="act-btn btn-suspend" onclick="updateStoreStatus('${s.id}', 'suspended')">
                  <i class="fa-solid fa-ban"></i> Suspend
                </button>
              `}
              <a href="https://wa.me/91${s.whatsapp || s.phone}?text=${waMsg}" target="_blank" class="act-btn btn-wa">
                <i class="fa-brands fa-whatsapp"></i> Notify
              </a>
              <button class="act-btn btn-del" onclick="deleteStoreRecord('${s.id}', '${(s.bizName || '').replace(/'/g, "\\'")}')" title="Delete Record">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      }).join("");
    };

    window.updateStoreStatus = async function(storeId, newStatus) {
      try {
        await updateDoc(doc(db, "license_requests", storeId), {
          status: newStatus,
          updatedAt: new Date().toISOString()
        });
        showToast(`Store ${storeId} marked as ${newStatus.toUpperCase()}!`);
      } catch (err) {
        alert("Failed to update status: " + err.message);
      }
    };

    window.deleteStoreRecord = async function(storeId, bizName) {
      if (!confirm(`Permanently delete license record for "${bizName}" (${storeId})?`)) return;
      try {
        await deleteDoc(doc(db, "license_requests", storeId));
        showToast("Store record deleted!");
      } catch (err) {
        alert("Delete failed: " + err.message);
      }
    };
  </script>
</body>
</html>
